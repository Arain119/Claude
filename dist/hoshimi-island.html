<style>

<script>
// ---- 00_core.js ----
'use strict';
/* ==========================================================================
   星见岛 · 小信使的春天 —— 核心工具：数学、随机、噪声、画质、几何合并、碰撞
   ========================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rng = mulberry32(20260403);
const R = (a = 0, b = 1) => a + (b - a) * rng();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];

const GRASS = { mesh: null, U: null, size: 56 };

  const W = WORLD, sx = W.x1 - W.x0, sz = W.z1 - W.z0;

  cam.position.set((W.x0 + W.x1) / 2, fromBelow ? -700 : 700, (W.z0 + W.z1) / 2); cam.rotation.set(fromBelow ? Math.PI / 2 : -Math.PI / 2, 0, 0); cam.updateMatrixWorld(true);
  scene.updateMatrixWorld(true);

  const hidden = [];
  const hide = (o) => { if (o && o.visible) { o.visible = false; hidden.push(o); } };
  for (const v of VEHICLES) hide(v.g); for (const c of CHARS) hide(c.root);
  scene.traverse(o => {
    if (o === scene) return;
    if (skip.has(o) || (fromBelow && /^bark\|/.test(o.name)) || o.name === 'sea' || o.name === 'river' || o.name === 'farland' || o.isSprite || o.isPoints || o.isLine || o.isInstancedMesh || o.isSkinnedMesh) { hide(o); return; }

  });

  const prevFog = scene.fog, prevC = new THREE.Color(); renderer.getClearColor(prevC); const prevA = renderer.getClearAlpha();
  scene.fog = null; scene.overrideMaterial = mat;
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, cam);
  renderer.setRenderTarget(null); scene.overrideMaterial = null; scene.fog = prevFog; renderer.setClearColor(prevC, prevA);

}
// 草地覆盖图：R = 最高人造表面高度，G = 是否有覆盖
function renderGrassCover(N) {
  const mat = new THREE.ShaderMaterial({ side: THREE.DoubleSide,
    vertexShader: 'varying float vY; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vY = w.y; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: 'varying float vY; void main(){ gl_FragColor = vec4(vY, 1.0, 0.0, 1.0); }' });

}
/* 占用图（CPU 可查询）：道路、人行道、建筑、铁路、栏杆等占据的位置不再种树和灌木 */
const OCC = { data: null, w: 0, h: 0 };
// 从地下往上看，记录每处最低的人造表面高度（16 位编码在 RG 中），再与地形比较：贴地的才算占用
function buildOccupancy() {
  const W = WORLD, sx = W.x1 - W.x0; const N = Math.round(sx / 0.5);
  const mat = new THREE.ShaderMaterial({ side: THREE.DoubleSide,
    vertexShader: 'varying float vY; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vY = w.y; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: 'varying float vY; void main(){ float v = clamp((vY + 50.0) / 250.0, 0.0, 1.0) * 255.0; gl_FragColor = vec4(floor(v) / 255.0, fract(v), 0.0, 1.0); }' });
  const rt = renderTopDown(N, mat, THREE.UnsignedByteType, true); mat.dispose();

  const G = TERRAIN_GRID;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = (j * w + i) * 4; if (px[k + 3] < 128) continue;
    const y = (px[k] + px[k + 1] / 255) / 255 * 250 - 50;
    const x = W.x0 + (i + 0.5) / w * sx, z = W.z0 + (j + 0.5) / h * (W.z1 - W.z0);
    const gi = clamp(Math.round((x - G.x0) / G.dx), 0, G.nx - 1), gj = clamp(Math.round((z - G.z0) / G.dz), 0, G.nz - 1);
    const th = G.data[(gj * G.nx + gi) * 4];

}
function occAt(x, z) {
  if (!OCC.data) return false; const W = WORLD;
  const i = Math.floor((x - W.x0) / (W.x1 - W.x0) * OCC.w), j = Math.floor((z - W.z0) / (W.z1 - W.z0) * OCC.h);
  if (i < 0 || j < 0 || i >= OCC.w || j >= OCC.h) return false;
  return OCC.data[j * OCC.w + i] === 1;
}
// 以 (x,z) 为圆心、半径 r 内是否有占用（中心 + 两圈采样）
function occNear(x, z, r) {
  if (occAt(x, z)) return true;
  for (const k of [0.5, 1]) for (let a = 0; a < 8; a++) { const t = a / 8 * TAU; if (occAt(x + Math.cos(t) * r * k, z + Math.sin(t) * r * k)) return true; }

    const ox = r() * S, oz = r() * S, r1 = r(), r2 = r();
    for (let v = 0; v < 5; v++) { const k = b * 5 + v; pos[k * 3] = TV[v][0]; pos[k * 3 + 1] = TV[v][1]; bl.set([ox, oz, r1, r2], k * 4); }

  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);
  const U = GRASS.U = {
    gCam: { value: new THREE.Vector2() }, gSize: { value: S }, gField: { value: field }, gFieldBox: { value: new THREE.Vector4(G.x0, G.z0, G.dx, G.dz) }, gFieldN: { value: new THREE.Vector2(G.nx, G.nz) },
    gCover: { value: cover }, gCoverBox: { value: new THREE.Vector4(WORLD.x0, WORLD.z0, WORLD.x1 - WORLD.x0, WORLD.z1 - WORLD.z0) },
    gH: { value: 0.5 }, gW: { value: 0.045 }, uTime: WIND.uTime, uWind: WIND.uWind, gTex: TERRAIN_U.tGrass,
    gPlayer: { value: new THREE.Vector3(1e6, 0, 1e6) }, gNPC: { value: new THREE.Vector3(1e6, 0, 1e6) }

/* ---------------- 动漫渲染：赛璐璐着色 + 描边 ---------------- */
// 两阶色：受光面 / 阴影面（阴影由天空半球光补成偏蓝紫的冷色，接近新海诚、京阿尼的上色方式）
const ANIME_GRAD = (() => { const d = new Uint8Array([150, 150, 150, 255, 150, 150, 150, 255, 236, 236, 236, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
const ANIME_LINE = lin(0x2b2236);
const ANIME_MATS = [];
// 平涂底色补光：白天较强，夜里减弱（避免角色在夜里自发光）
function animeUpdate(night) { const k = lerp(0.3, 0.05, night); for (const m of ANIME_MATS) m.emissive.setScalar(k); }
function animeToon(src, skinning) {
  const m = new THREE.MeshToonMaterial({ map: src && src.map || null, color: src && src.color ? src.color.clone() : new THREE.Color(1, 1, 1), gradientMap: ANIME_GRAD, skinning: !!skinning });
  if (m.map) { m.map.anisotropy = Math.max(m.map.anisotropy || 1, 4); m.emissiveMap = m.map; }
  m.emissive.setScalar(0.3); ANIME_MATS.push(m);
  return m;
}
// 背面外扩描边（width 以米计，随距离略加粗，保证远处仍可见）
function animeOutline(width, skinning) {
  const m = new THREE.MeshBasicMaterial({ color: ANIME_LINE, side: THREE.BackSide, skinning: !!skinning });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.outlineW = { value: width };
    sh.vertexShader = 'uniform float outlineW;\n' + sh.vertexShader
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position);')
      .replace('#include <project_vertex>', `#include <project_vertex>
        { vec4 c0 = modelViewMatrix * vec4(transformed, 1.0); float k = outlineW * clamp(-c0.z * 0.12, 1.0, 3.0);
          vec3 on = normal;
          #ifdef USE_SKINNING
            mat4 sm = bindMatrixInverse * (skinWeight.x * boneMatX + skinWeight.y * boneMatY + skinWeight.z * boneMatZ + skinWeight.w * boneMatW) * bindMatrix; on = (sm * vec4(normal, 0.0)).xyz;
          #endif
          vec3 n = normalize(normalMatrix * on); mvPosition = c0 + vec4(n * k, 0.0); gl_Position = projectionMatrix * mvPosition; }`);
  };
  return m;
}
// 给普通模型加描边（与原网格共享几何）
function addOutline(mesh, width) {
  const o = new THREE.Mesh(mesh.geometry, animeOutline(width, false)); o.castShadow = false; o.receiveShadow = false; o.matrixAutoUpdate = false; mesh.add(o); return o;
}

/* 把切好的身体部件合成一个蒙皮网格：部件 → 骨骼一一对应，动画仍沿用 poseCharacter */
const SKIN_PARTS = ['hips', 'torso', 'head', 'uaL', 'faL', 'thL', 'shL', 'uaR', 'faR', 'thR', 'shR'];
function buildSkinGeo(M) {
  const off = (p) => {
    const sg = p.endsWith('L') ? 1 : -1, k = p.slice(0, 2);
    if (p === 'hips' || p === 'torso') return [0, M.hipY, 0]; if (p === 'head') return [0, M.neckY, 0];
    if (k === 'ua') return [sg * M.shoulderX, M.armY, 0]; if (k === 'fa') return [sg * M.shoulderX, M.armY - (M.elbowX - M.shoulderX), 0];
    if (k === 'th') return [sg * M.legX, M.hipY, 0]; return [sg * M.legX, M.kneeY, 0];
  };
  let n = 0; for (const p of SKIN_PARTS) n += M.g[p].attributes.position.count;
  const hasUV = !!M.g.torso.attributes.uv;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = hasUV ? new Float32Array(n * 2) : null, si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
  let o = 0;
  SKIN_PARTS.forEach((p, bi) => {
    const g = M.g[p], P = g.attributes.position, Nn = g.attributes.normal, U = g.attributes.uv, d = off(p);
    for (let i = 0; i < P.count; i++, o++) {
      pos[o * 3] = P.getX(i) + d[0]; pos[o * 3 + 1] = P.getY(i) + d[1]; pos[o * 3 + 2] = P.getZ(i) + d[2];
      if (Nn) { nor[o * 3] = Nn.getX(i); nor[o * 3 + 1] = Nn.getY(i); nor[o * 3 + 2] = Nn.getZ(i); }
      if (uv && U) { uv[o * 2] = U.getX(i); uv[o * 2 + 1] = U.getY(i); }
      si[o * 4] = bi; sw[o * 4] = 1;
    }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  if (uv) geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4)); geo.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
  geo.computeBoundingSphere(); geo.boundingSphere.radius += 0.6;
  return geo;
}

const PATHS = {};
function buildPaths() {
  PATHS.main = { loop: true, pts: [[5.4, -46], [5.4, 35.2], [-5.4, 35.2], [-5.4, -46]] };
  const rv = []; for (let z = -40; z <= 82; z += 6) rv.push([riverAtZ(z) + 11.0, z]); PATHS.river = { loop: false, pts: rv };
  PATHS.harbor = { loop: false, pts: [[110, -22], [110, 56]] };
  PATHS.south = { loop: false, pts: [[-55, 45.6], [96, 45.6], [106, 45.6], [106, -60]] };
  PATHS.beach = { loop: false, pts: [[-40, 120], [60, 124]] };
}
function pathLen(P) { let L = 0; const n = P.pts.length; for (let i = 0; i < (P.loop ? n : n - 1); i++) { const a = P.pts[i], b = P.pts[(i + 1) % n]; L += Math.hypot(b[0] - a[0], b[1] - a[1]); } return L; }
function pathAt(P, s) {
  // s：沿路径的距离；非循环路径往返
  const L = P.L || (P.L = pathLen(P)); let d, back = false;
  if (P.loop) d = ((s % L) + L) % L; else { const m = ((s % (2 * L)) + 2 * L) % (2 * L); if (m > L) { d = 2 * L - m; back = true; } else d = m; }

  for (let i = 0; i < (P.loop ? n : n - 1); i++) { const a = P.pts[i], b = P.pts[(i + 1) % n]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d <= l) { const t = d / l; let dx = b[0] - a[0], dz = b[1] - a[1]; if (back) { dx = -dx; dz = -dz; } return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, Math.atan2(dx, dz)]; } d -= l; }
  const e = P.pts[P.loop ? 0 : n - 1]; return [e[0], e[1], 0];
}

const GULLS = [];
function buildGulls() {
  const wingL = new THREE.PlaneGeometry(1.15, 0.32); wingL.rotateX(-Math.PI / 2); wingL.translate(0.58, 0, 0);
  const wingR = wingL.clone(); wingR.scale(-1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ color: 0xf4f4f0, roughness: 0.8 });
  const wmat = new THREE.MeshStandardMaterial({ color: 0xe6e9e2, roughness: 0.85, side: THREE.DoubleSide });
  const spots = [[150, 32, 24, 24], [64, 138, 30, 22], [-36, 148, 28, 24], [176, -14, 22, 20], [108, -146, 34, 30], [-140, 66, 26, 22], [30, 100, 26, 20]];
  for (const [cx, cz, r, cy] of spots) {
    const n = RI(2, 3);
    for (let i = 0; i < n; i++) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), mat); body.scale.set(0.75, 0.7, 2.1);
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.03, 0.3), wmat); tail.position.set(0, 0.02, -0.42);
      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.18, 6), new THREE.MeshStandardMaterial({ color: 0xe8a23a, roughness: 0.6 })); beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.03, 0.42);
      const wl = new THREE.Mesh(wingL, wmat), wr = new THREE.Mesh(wingR, wmat);
      g.add(body, tail, beak, wl, wr); scene.add(g);
      GULLS.push({ g, wl, wr, cx: cx + R(-8, 8), cz: cz + R(-8, 8), r: r * R(0.6, 1.25), cy: cy + R(-3, 3), ph: R(0, TAU), sp: R(0.22, 0.42) * (chance(0.5) ? 1 : -1), fl: R(6, 9) });
    }
  }
}
function updateGulls(dt, t, day) {
  for (const u of GULLS) {
    u.g.visible = day;
    if (!day) continue;
    const a = u.ph + t * u.sp;
    u.g.position.set(u.cx + Math.cos(a) * u.r, u.cy + Math.sin(t * 0.7 + u.ph) * 2.5 + Math.sin(t * 0.23 + u.ph * 2) * 3, u.cz + Math.sin(a) * u.r);

    u.g.rotation.set(0, Math.atan2(vx, vz), 0.3 * Math.sign(u.sp), 'YXZ');
    const f = Math.sin(t * u.fl + u.ph) * 0.55;
    u.wl.rotation.z = f; u.wr.rotation.z = -f;
  }
}

/* ==========================================================================
   居民通勤：店员早上从车站方向沿商店街走进店里、下班再走回去；
   手写的路线保证全程走在路面/广场上。雨天步行者会撑伞。
   ========================================================================== */
function commuteRoute(n) {
  const d = n.d, id = d.id;
  if (d.at && d.at.shop) {
    const sh = SHOPS.find(s => s.def.id === d.at.shop); if (!sh) return null;
    const E = sh.def.side === 'E'; const sx = E ? 4.5 : -4.5;
    return [[26, -47], [sx, -44], [sx, clamp(n.home[1], -42, 34)], [n.home[0], n.home[1]]];
  }
  switch (id) {
    case 'laohai': return [[110, -22], [110, 8], [n.home[0], n.home[1]]];
    case 'qianhe': return [[-40, -86], [-40, -112], [n.home[0], n.home[1]]];
    case 'chengcheng': return [[-40, -86], [-40, -112], [n.home[0], n.home[1]]];
    case 'yezi': return [[-62, -20], [-62, 10], [n.home[0], n.home[1]]];
    case 'alan': return [[60, 124], [28, 121], [n.home[0], n.home[1]]];
    case 'xiaozhou': return [[-40, 120], [-13, 119], [n.home[0], n.home[1]]];
    case 'wenye': case 'wennai': return [[4.5, 35], [2, 56], [n.home[0], n.home[1]]];

}
/* 沿通勤路线走一步；返回 true 表示走完 */
function commuteStep(n, dt, back) {
  const C = n.com, rt = C.route;
  const wp = rt[back ? rt.length - 1 - C.i : C.i];
  const dx = wp[0] - n.pos.x, dz = wp[1] - n.pos.z, d = Math.hypot(dx, dz);
  if (d < 0.45) { C.i++; return C.i >= rt.length; }
  const sp = Math.max(n.speed, 1.1) * (WEATHER.rain > 0.4 ? 1.35 : 1);
  n.pos.x += dx / d * sp * dt; n.pos.z += dz / d * sp * dt;
  n.pos.y = groundAt(n.pos.x, n.pos.z, n.pos.y + 0.6);
  let dy = Math.atan2(dx, dz) - n.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); n.yaw += dy * Math.min(1, dt * 8);
  return false;
}
function initCommutes() {
  const hour = S().min / 60, day = S().day;
  for (const n of NPCS) {
    const route = commuteRoute(n); if (!route) continue;
    const h = n.d.hours; const active = npcActive(n, hour);
    const after = h[0] <= h[1] ? hour >= h[1] : (hour >= h[1] && hour < h[0]);
    n.com = { route, i: 0, mode: '', day, done: active || after, left: !active && after };
  }
}
