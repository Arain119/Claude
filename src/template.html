<title>星见岛</title>
<meta name="description" content="一座可以自由驾驶、自由行走的写实日式樱花小岛：做岛上的小信使，在车流、电车、渔港与山路之间送信生活。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&family=Oswald:wght@500;700&display=swap">
<style>
/* 版式：写实开放世界 HUD —— 左下圆角小地图、右上时间与钱、右下车速、左上任务、底部字幕式对话 */
:root {
  --glass: rgba(12, 15, 20, 0.62); --glass-2: rgba(255, 255, 255, 0.08); --glass-3: rgba(255, 255, 255, 0.14);
  --fg: #f1f3f6; --fg-soft: #a7afba; --line: rgba(255, 255, 255, 0.14);
  --accent: #f0b429; --money: #7fd36b; --pink: #ef8fae; --mission: #4fb3e8; --danger: #ef5b4c; --night: #07090d;
  --f-display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Oswald", "Noto Sans SC", system-ui, sans-serif;
  --r: 10px; --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font-family: var(--f-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); }
.num { font-variant-numeric: tabular-nums; }
.txt-shadow { text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.5); }
/* --- 标题 --- */
#title { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; padding: 16px; padding-block: 16px 7vh; background: linear-gradient(180deg, #0b1220 0%, #1a2638 60%, #0b0f16 100%); overflow: hidden; }
.title-box { position: relative; width: min(1100px, 100%); margin: 0 auto; display: grid; gap: 18px; }
.title-kicker { font: 500 13px var(--f-num); letter-spacing: .5em; color: var(--accent); text-transform: uppercase; }
.title-name { font-family: var(--f-display); font-weight: 400; font-size: clamp(72px, 15vw, 168px); line-height: .9; color: #fff; letter-spacing: .06em; margin: 0; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
.title-sub { font: 500 clamp(16px, 2.6vw, 22px) var(--f-body); color: #d9dee6; letter-spacing: .1em; max-width: 34em; line-height: 1.7; text-wrap: balance; }
.title-card { padding: 16px 18px; width: min(560px, 100%); display: grid; gap: 12px; }
.bar { height: 4px; border-radius: 4px; background: var(--glass-3); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
#loadText { font-size: 12.5px; color: var(--fg-soft); }
.btn-main { justify-self: start; border: 0; border-radius: 6px; padding: 12px 34px; background: var(--accent); color: #111; font: 700 18px var(--f-body); letter-spacing: .3em; transition: transform .15s, filter .15s; }
.btn-main:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn-main:disabled { opacity: .35; cursor: wait; transform: none; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: 12.5px; color: var(--fg-soft); }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--glass-3); font: 600 11.5px/1.5 var(--f-body); color: var(--fg); text-align: center; }
/* --- HUD --- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud.hidden > *:not(#toasts) { opacity: 0; }
#hud > * { transition: opacity .3s; }
.tr { position: absolute; right: 18px; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; justify-items: end; gap: 2px; }
.tr .t { font: 700 34px/1 var(--f-num); letter-spacing: .02em; }
.tr .d { font-size: 12.5px; color: #e6e9ee; letter-spacing: .08em; }
.tr .money { font: 700 30px/1.1 var(--f-num); color: var(--money); display: flex; align-items: center; gap: 6px; }
.tr .money small { font: 500 12px var(--f-body); color: #e6e9ee; }
.tbtns { margin-top: 10px; display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.tbtn { border: 1px solid var(--line); background: var(--glass); border-radius: 6px; padding: 5px 9px; font-size: 12px; display: flex; align-items: center; gap: 5px; }
.tbtn kbd { font-size: 10px; padding: 0 4px; }
.tl { position: absolute; left: 18px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(330px, 44vw); }
.tasks { padding: 10px 12px; display: grid; gap: 6px; }
.tasks h3 { margin: 0; font: 700 12px var(--f-body); letter-spacing: .2em; color: var(--accent); display: flex; justify-content: space-between; }
.tasks h3 small { color: var(--fg-soft); letter-spacing: 0; font-weight: 500; }
.tasks ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.tasks li { font-size: 13px; line-height: 1.45; display: grid; grid-template-columns: 10px 1fr; gap: 7px; min-width: 0; }
.tasks li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; background: var(--pink); }
.tasks li.story::before { background: var(--mission); }
.tasks li em { font-style: normal; color: var(--fg-soft); font-size: 12px; }
.bl { position: absolute; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.mm-wrap { position: relative; width: 230px; height: 150px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(0,0,0,.55); box-shadow: var(--shadow); }
#minimap { width: 100%; height: 100%; display: block; background: #23313d; }
.mm-n { position: absolute; top: 6px; left: 8px; font: 700 11px var(--f-num); background: rgba(0,0,0,.6); border-radius: 4px; padding: 0 5px; }
#wpDist { position: absolute; right: 8px; bottom: 6px; font: 700 12px var(--f-num); color: var(--accent); }
.place-chip { font: 700 15px var(--f-body); letter-spacing: .06em; }
.br { position: absolute; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: right; display: grid; justify-items: end; gap: 0; }
#speedo b { font: 700 64px/0.9 var(--f-num); }
#speedo span { font: 700 14px var(--f-num); color: var(--fg-soft); margin-left: 4px; }
#speedo div { font-size: 13px; color: #e6e9ee; letter-spacing: .1em; }
#prompt { position: absolute; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; font-size: 14px; display: flex; gap: 10px; align-items: center; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: auto; }
#prompt kbd { background: var(--fg); color: #111; border-color: var(--fg); }
#bite { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font: 700 72px var(--f-num); color: var(--accent); text-shadow: 0 3px 16px rgba(0,0,0,.7); animation: pop .3s ease-out; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.3); } to { transform: translate(-50%, -50%) scale(1); } }
#toasts { position: absolute; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: min(560px, calc(100vw - 32px)); }
.toast { padding: 8px 16px; font-size: 13.5px; line-height: 1.6; text-align: center; animation: tin .35s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
#stampPop { position: fixed; z-index: 30; left: 50%; top: 42%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px; pointer-events: none; }
#stampPop canvas { width: 120px; height: 150px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); animation: stampIn .7s cubic-bezier(.2, 1.4, .4, 1); }
#stampPop div { padding: 8px 16px; font-size: 14px; text-align: center; }
#stampPop b { font: 700 18px var(--f-body); display: block; color: var(--accent); }
@keyframes stampIn { from { transform: scale(1.8) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: 1; } }
/* 字幕式对话 */
#dialog { position: fixed; z-index: 20; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); padding: 14px 18px; display: grid; grid-template-columns: 64px 1fr; gap: 14px; pointer-events: auto; background: rgba(8, 10, 14, 0.78); }
#portrait { width: 64px; height: 64px; border-radius: 50%; background: var(--glass-3); border: 2px solid rgba(255,255,255,.6); }
.dl-body { min-width: 0; display: grid; gap: 8px; }
.dl-name { display: flex; gap: 8px; align-items: baseline; }
.dl-name b { font: 700 16px var(--f-body); color: var(--accent); }
.dl-name small { font-size: 12px; color: var(--fg-soft); }
.dl-name .hearts { margin-left: auto; color: var(--pink); font-size: 12px; letter-spacing: 1px; }
#dlText { font-size: 15.5px; line-height: 1.75; white-space: pre-line; min-height: 2.2em; }
#dlChoices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1px solid var(--line); background: var(--glass-2); border-radius: 6px; padding: 7px 14px; font-size: 13.5px; transition: background .15s, border-color .15s; }
.choice:hover { background: var(--glass-3); border-color: var(--accent); }
.choice.primary { background: var(--fg); color: #111; border-color: var(--fg); }
/* 面板（暂停菜单） */
#panel { position: fixed; z-index: 25; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(4, 6, 10, .55); pointer-events: auto; }
.pn { width: min(860px, 100%); max-height: min(88vh, 780px); display: grid; grid-template-rows: auto 1fr; overflow: hidden; background: rgba(12, 15, 20, 0.9); }
.pn-head { display: flex; align-items: center; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pn-tab { border: 0; background: none; padding: 8px 14px 10px; font: 700 14px var(--f-body); letter-spacing: .12em; color: var(--fg-soft); border-bottom: 3px solid transparent; }
.pn-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pn-close { margin-left: auto; border: 1px solid var(--line); background: var(--glass-2); border-radius: 6px; padding: 4px 12px; font-size: 13px; }
.pn-body { overflow: auto; padding: 16px 18px 20px; min-height: 0; }
.pn-body h4 { margin: 0 0 10px; font: 700 13px var(--f-body); letter-spacing: .15em; color: var(--accent); }
.grid-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--glass-2); display: grid; gap: 4px; min-width: 0; }
.item b { font-weight: 700; font-size: 14px; }
.item small { color: var(--fg-soft); font-size: 12px; line-height: 1.5; }
.item .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.item button { border: 0; border-radius: 6px; background: var(--accent); color: #111; padding: 5px 12px; font-size: 12.5px; font-weight: 700; }
.price { display: inline-flex; align-items: center; gap: 4px; font: 700 14px var(--f-num); color: var(--money); }
.empty { color: var(--fg-soft); font-size: 14px; line-height: 1.8; padding: 12px 0; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.stamp { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 12px; color: var(--fg-soft); }
.stamp canvas { width: 72px; height: 90px; }
.stamp b { color: var(--fg); font-size: 13px; }
.stamp.locked canvas { opacity: .25; filter: grayscale(1); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.person { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--glass-2); }
.person canvas { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-3); }
.person b { font-size: 14px; } .person small { display: block; font-size: 11.5px; color: var(--fg-soft); }
.person .h { color: var(--pink); font-size: 11px; letter-spacing: 1px; }
.diary { display: grid; gap: 10px; }
.diary p { margin: 0; font-size: 14px; line-height: 1.8; padding-left: 12px; border-left: 2px solid var(--accent); }
.diary time { display: block; font-size: 11.5px; color: var(--fg-soft); }
#bigmap { width: min(100%, 64vh); aspect-ratio: 1; border-radius: 8px; display: block; margin: 0 auto; cursor: crosshair; }
.map-hint { font-size: 12.5px; color: var(--fg-soft); text-align: center; margin: 8px 0 0; }
.set { display: grid; gap: 14px; }
.set-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
.set-row > span, .set-row > label { font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--glass-2); border-radius: 6px; padding: 6px 14px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: #111; border-color: var(--fg); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.shell { width: 16px; height: 13px; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 100%, #f9d9c6 0 30%, #e8a98c 31% 100%); position: relative; flex: none; display: inline-block; }
/* 触屏 */
#mobile { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
#joy { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.08); }
#joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.8); }
.mbtns { position: absolute; right: 16px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 62px); gap: 10px; pointer-events: auto; }
.mbtn { width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); font-size: 12.5px; font-weight: 700; touch-action: manipulation; }
.mbtn.big { background: var(--accent); color: #111; }
#fade { position: fixed; inset: 0; z-index: 40; background: #05070b; opacity: 0; pointer-events: none; transition: opacity .8s; display: grid; place-items: center; color: #fff; font: 400 28px var(--f-display); letter-spacing: .3em; }
#fade.on { opacity: 1; pointer-events: auto; }
@media (max-width: 640px) {
  .tl { width: min(220px, 56vw); }
  .tr .t { font-size: 26px; } .tr .money { font-size: 22px; }
  .tasks li em { display: none; }
  .mm-wrap { width: 150px; height: 104px; }
  .br { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: 96px; } #speedo b { font-size: 44px; }
  #dialog { grid-template-columns: 46px 1fr; padding: 12px 14px; }
  #portrait { width: 46px; height: 46px; }
  .set-row { grid-template-columns: 1fr; gap: 6px; }
  .tbtn kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<canvas id="game" tabindex="0" aria-label="星见岛 3D 场景"></canvas>

<div id="title">
  <div class="title-box">
    <div class="title-kicker">Hoshimi Island · 春</div>

    <div class="title-sub">四月的海岛。你是邮局新来的小信使：骑上邮政摩托，穿过商店街、渔港、田园与山路，把每一封信送到收信人手里。</div>
