<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星见岛 · 小信使的春天</title>
<meta name="description" content="一座可以自由行走的动漫风樱花小岛：做小信使，送信、逛商店街、看夜樱、等一场樱花树下的约定。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap">
<style>
/* 版式：全屏 3D 画布之上漂浮的「信纸卡片」HUD；左上时间与任务、右上小地图、底部交互与对话 */
:root {
  --paper: #fbf7ef; --paper-2: #f3ece0; --ink: #22304a; --ink-soft: #5b6478; --line: rgba(34, 48, 74, 0.14);
  --sakura: #de7f9c; --sakura-soft: #f6d3dd; --sea: #2b8a96; --gold: #c9973a; --night: #141c33;
  --f-display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-hand: "Ma Shan Zheng", "KaiTi", "STKaiti", serif;
  --r: 14px; --shadow: 0 6px 22px rgba(20, 28, 51, 0.16), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sakura); outline-offset: 2px; }
.card { background: rgba(251, 247, 239, 0.93); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.num { font-variant-numeric: tabular-nums; }
/* --- 加载 / 标题 --- */
#title { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: radial-gradient(120% 80% at 70% 10%, #ffe9ef 0%, #f6cfda 30%, #9fc9e6 72%, #5d8fc4 100%); overflow: hidden; }
#title::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.7) 0 2px, transparent 3px), radial-gradient(circle at 80% 60%, rgba(255,255,255,.6) 0 1.5px, transparent 2.5px); background-size: 140px 140px, 90px 90px; opacity: .55; }
.title-box { position: relative; text-align: center; max-width: 560px; width: 100%; display: grid; gap: 14px; justify-items: center; }
.title-kicker { font-size: 13px; letter-spacing: .5em; color: #fff; text-shadow: 0 1px 6px rgba(70, 40, 80, .35); padding-left: .5em; }
.title-name { font-family: var(--f-display); font-size: clamp(64px, 16vw, 128px); line-height: 1; color: #fff; letter-spacing: .08em; text-shadow: 0 4px 24px rgba(160, 60, 100, .35), 0 2px 0 rgba(222, 127, 156, .6); margin: 0; }
.title-sub { font-family: var(--f-hand); font-size: clamp(22px, 5vw, 32px); color: #fff; text-shadow: 0 2px 10px rgba(60, 40, 80, .35); }
.title-card { margin-top: 14px; padding: 18px 20px; width: min(440px, 100%); display: grid; gap: 12px; text-align: left; }
.title-card p { margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink-soft); }
.bar { height: 6px; border-radius: 6px; background: var(--paper-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sakura), #f4b07a); transition: width .25s; }
#loadText { font-size: 12px; color: var(--ink-soft); }
.btn-main { justify-self: stretch; border: 0; border-radius: 999px; padding: 13px 22px; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-size: 22px; letter-spacing: .2em; box-shadow: 0 6px 18px rgba(34, 48, 74, .3); transition: transform .15s, background .15s; }
.btn-main:hover { transform: translateY(-1px); background: #2c3d5e; }
.btn-main:disabled { opacity: .45; cursor: wait; transform: none; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); border-bottom-width: 2px; background: #fff; font: 600 11.5px/1.5 var(--f-body); color: var(--ink); text-align: center; }
/* --- HUD --- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud.hidden > *:not(#toasts) { opacity: 0; }
#hud > * { transition: opacity .3s; }
.tl { position: absolute; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: grid; gap: 10px; width: min(250px, 46vw); }
.clock { padding: 10px 14px 12px; display: grid; gap: 2px; }
.clock .d { font-size: 12px; color: var(--ink-soft); letter-spacing: .08em; }
.clock .t { display: flex; align-items: baseline; gap: 10px; }
.clock .t b { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; }
.clock .t span { font-size: 13px; color: var(--sakura); font-weight: 700; }
.coins { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); margin-top: 4px; }
.shell { width: 16px; height: 13px; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 100%, #f9d9c6 0 30%, #f0b9a0 31% 100%); position: relative; flex: none; }
.shell::after { content: ""; position: absolute; inset: 2px 3px 0; background: repeating-linear-gradient(90deg, transparent 0 2px, rgba(160, 90, 70, .35) 2px 3px); border-radius: inherit; }
.tasks { padding: 10px 14px 12px; display: grid; gap: 6px; }
.tasks h3 { margin: 0; font: 400 16px var(--f-display); display: flex; justify-content: space-between; align-items: baseline; }
.tasks h3 small { font: 500 11px var(--f-body); color: var(--ink-soft); }
.tasks ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.tasks li { font-size: 12.5px; line-height: 1.45; display: grid; grid-template-columns: 10px 1fr; gap: 6px; align-items: start; min-width: 0; }
.tasks li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; margin-top: 5px; background: var(--sakura); transform: rotate(45deg); }
.tasks li.story::before { background: var(--sea); }
.tasks li em { font-style: normal; color: var(--ink-soft); }
.tr { position: absolute; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; justify-items: end; }
#minimap { width: 156px; height: 156px; border-radius: 50%; border: 3px solid rgba(251, 247, 239, .95); box-shadow: var(--shadow); background: #9cc6d8; display: block; }
.mm-wrap { position: relative; }
.mm-n { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); font: 700 11px var(--f-body); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0 6px; }
.place-chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(251, 247, 239, .9); border: 1px solid var(--line); color: var(--ink); max-width: 200px; text-align: center; }
.tbtns { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 210px; }
.tbtn { border: 1px solid var(--line); background: rgba(251, 247, 239, .93); border-radius: 12px; padding: 6px 9px; font-size: 12px; display: grid; justify-items: center; gap: 1px; box-shadow: var(--shadow); min-width: 46px; }
.tbtn kbd { font-size: 10px; padding: 0 4px; }
#prompt { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; font-size: 14px; display: flex; gap: 10px; align-items: center; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: auto; }
#prompt[hidden] { display: none !important; }
#prompt kbd { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#bite { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font: 400 64px var(--f-display); color: #fff; text-shadow: 0 3px 16px rgba(200, 40, 60, .7); animation: pop .3s ease-out; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.3); } to { transform: translate(-50%, -50%) scale(1); } }
#toasts { position: absolute; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: min(560px, calc(100vw - 32px)); }
.toast { padding: 9px 16px; font-size: 13.5px; line-height: 1.6; text-align: center; animation: tin .35s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
/* 印章弹出 */
#stampPop { position: fixed; z-index: 30; left: 50%; top: 42%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px; pointer-events: none; }
#stampPop canvas { width: 120px; height: 150px; filter: drop-shadow(0 8px 18px rgba(20, 28, 51, .35)); animation: stampIn .7s cubic-bezier(.2, 1.4, .4, 1); }
#stampPop div { padding: 8px 16px; font-size: 14px; text-align: center; }
#stampPop b { font: 400 20px var(--f-display); display: block; }
@keyframes stampIn { from { transform: scale(1.8) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: 1; } }
/* 对话 */
#dialog { position: fixed; z-index: 20; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(720px, calc(100vw - 32px)); padding: 16px 18px; display: grid; grid-template-columns: 76px 1fr; gap: 14px; pointer-events: auto; }
#portrait { width: 76px; height: 76px; border-radius: 50%; background: var(--sakura-soft); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.dl-body { min-width: 0; display: grid; gap: 8px; }
.dl-name { display: flex; gap: 8px; align-items: baseline; }
.dl-name b { font: 400 21px var(--f-display); }
.dl-name small { font-size: 12px; color: var(--ink-soft); }
.dl-name .hearts { margin-left: auto; color: var(--sakura); font-size: 12px; letter-spacing: 1px; }
#dlText { font-size: 15px; line-height: 1.8; white-space: pre-line; min-height: 2.2em; }
#dlChoices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 13.5px; transition: background .15s, border-color .15s; }
.choice:hover { background: var(--sakura-soft); border-color: var(--sakura); }
.choice.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
/* 面板 */
#panel { position: fixed; z-index: 25; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(20, 28, 51, .35); pointer-events: auto; }
.pn { width: min(780px, 100%); max-height: min(86vh, 760px); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.pn-head { display: flex; align-items: center; gap: 6px; padding: 12px 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pn-tab { border: 0; background: none; padding: 8px 12px 10px; font: 400 18px var(--f-display); color: var(--ink-soft); border-bottom: 3px solid transparent; }
.pn-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sakura); }
.pn-close { margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.pn-body { overflow: auto; padding: 16px 18px 20px; min-height: 0; }
.pn-body h4 { margin: 0 0 10px; font: 400 18px var(--f-display); }
.grid-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; display: grid; gap: 4px; min-width: 0; }
.item b { font-weight: 700; font-size: 14px; }
.item small { color: var(--ink-soft); font-size: 12px; line-height: 1.5; }
.item .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.item button { border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); padding: 5px 12px; font-size: 12.5px; }
.price { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
.empty { color: var(--ink-soft); font-size: 14px; line-height: 1.8; padding: 12px 0; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.stamp { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 12px; color: var(--ink-soft); }
.stamp canvas { width: 72px; height: 90px; }
.stamp b { color: var(--ink); font-size: 13px; }
.stamp.locked canvas { opacity: .3; filter: grayscale(1); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.person { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; }
.person canvas { width: 44px; height: 44px; border-radius: 50%; background: var(--sakura-soft); }
.person b { font-size: 14px; } .person small { display: block; font-size: 11.5px; color: var(--ink-soft); }
.person .h { color: var(--sakura); font-size: 11px; letter-spacing: 1px; }
.diary { display: grid; gap: 10px; }
.diary p { margin: 0; font-size: 14px; line-height: 1.8; padding-left: 12px; border-left: 2px solid var(--sakura-soft); }
.diary time { display: block; font-size: 11.5px; color: var(--ink-soft); }
#bigmap { width: min(100%, 62vh); aspect-ratio: 1; border-radius: 12px; display: block; margin: 0 auto; cursor: pointer; }
.map-hint { font-size: 12.5px; color: var(--ink-soft); text-align: center; margin: 8px 0 0; }
.set { display: grid; gap: 14px; }
.set-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
.set-row > span { font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--sakura); }
/* 触屏 */
#mobile { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
#joy { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .15); }
#joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(251, 247, 239, .9); box-shadow: var(--shadow); }
.mbtns { position: absolute; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; pointer-events: auto; }
.mbtn { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: rgba(251, 247, 239, .9); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; touch-action: manipulation; }
.mbtn.big { background: var(--ink); color: var(--paper); }
#fade { position: fixed; inset: 0; z-index: 40; background: #0c1226; opacity: 0; pointer-events: none; transition: opacity .8s; display: grid; place-items: center; color: #fff; font: 400 28px var(--f-display); letter-spacing: .3em; }
#fade.on { opacity: 1; pointer-events: auto; }
@media (max-width: 640px) {
  .tl { width: min(210px, 52vw); }
  .clock .t b { font-size: 28px; }
  #minimap { width: 112px; height: 112px; }
  .tasks li em { display: none; }
  #dialog { grid-template-columns: 52px 1fr; padding: 12px 14px; }
  #portrait { width: 52px; height: 52px; }
  .set-row { grid-template-columns: 1fr; gap: 6px; }
  .tbtn { min-width: 40px; padding: 5px 7px; } .tbtn kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="星见岛 3D 场景"></canvas>

<div id="title">
  <div class="title-box">
    <div class="title-kicker">HOSHIMI ISLAND · SPRING</div>
    <h1 class="title-name">星见岛</h1>
    <div class="title-sub">小信使的春天</div>
    <div class="title-card card">
      <p>四月的星见岛，樱花开满了整条海风通。你是邮局新来的小信使：去方姐那里领信，穿过商店街、河堤和神社，把每一封信送到收信人手里。</p>
      <div class="bar" aria-hidden="true"><i id="loadBar"></i></div>
      <div id="loadText">正在准备小岛……</div>
      <button class="btn-main" id="startBtn" disabled>开始旅程</button>
      <div class="keys" id="keysHelp"></div>
    </div>
  </div>
</div>

<div id="hud" hidden>
  <div class="tl">
    <div class="card clock">
      <div class="d" id="hudDay">第 1 天 · 周六 · 晴</div>
      <div class="t"><b class="num" id="hudTime">09:00</b><span id="hudPhase">上午</span></div>
      <div class="coins"><span class="shell" aria-hidden="true"></span><span class="num" id="hudCoins">20</span> 贝壳币</div>
    </div>
    <div class="card tasks" id="tasks">
      <h3>今日邮件 <small id="taskCount">0 封</small></h3>
      <ul id="taskList"></ul>
    </div>
  </div>
  <div class="tr">
    <div class="mm-wrap"><canvas id="minimap" width="312" height="312" aria-label="小地图"></canvas><span class="mm-n">北</span></div>
    <div class="place-chip" id="placeChip">樱丘町</div>
    <div class="tbtns">
      <button class="tbtn" data-panel="map">地图<kbd>Tab</kbd></button>
      <button class="tbtn" data-panel="bag">背包<kbd>B</kbd></button>
      <button class="tbtn" data-panel="journal">手账<kbd>J</kbd></button>
      <button class="tbtn" data-panel="settings">设置<kbd>Esc</kbd></button>
    </div>
  </div>
  <button id="prompt" class="card" hidden><kbd>E</kbd><span id="promptText"></span></button>
  <div id="bite" hidden>！</div>
  <div id="toasts" aria-live="polite"></div>
</div>

<div id="mobile" hidden>
  <div id="joy" hidden><i></i></div>
  <div class="mbtns">
    <button class="mbtn" id="mCam">视角</button>
    <button class="mbtn" id="mJump">跳跃</button>
    <button class="mbtn" id="mRun">快跑</button>
    <button class="mbtn big" id="mAct">互动</button>
  </div>
</div>

<div id="dialog" class="card" hidden>
  <canvas id="portrait" width="152" height="152"></canvas>
  <div class="dl-body">
    <div class="dl-name"><b id="dlName"></b><small id="dlTitle"></small><span class="hearts" id="dlHearts"></span></div>
    <div id="dlText"></div>
    <div id="dlChoices"></div>
  </div>
</div>

<div id="panel" hidden>
  <div class="pn card" role="dialog" aria-modal="true">
    <div class="pn-head" id="pnHead"></div>
    <div class="pn-body" id="pnBody"></div>
  </div>
</div>

<div id="stampPop" hidden></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- 00_core.js ----
'use strict';
/* ==========================================================================
   星见岛 · 小信使的春天 —— 核心工具：数学、随机、噪声、画质、几何合并、碰撞
   ========================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rng = mulberry32(20260403);
const R = (a = 0, b = 1) => a + (b - a) * rng();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];
const chance = (p) => rng() < p;
function seed(s) { rng = mulberry32(s); }

function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);

function islandC(x, z) {

/* --- 卡片累加器（带 sway 属性与乱序索引，便于按画质截断） --- */
const CARD_BUCKETS = new Map();

  let b = CARD_BUCKETS.get(key); if (!b) { b = { kind, pos: [], nor: [], uv: [], col: [], sway: [], q: 0 }; CARD_BUCKETS.set(key, b); } return b;

    g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
    g.setAttribute('sway', new THREE.Float32BufferAttribute(b.sway, 1));

/* --- 枝条生长 --- */
function growBranches(kit, p, az, el, len, r, depth, P, tips) {
  const dir = (a, e) => [Math.cos(e) * Math.cos(a), Math.sin(e), Math.cos(e) * Math.sin(a)];
  const d0 = dir(az, el);
  const elMid = el - P.droop * (depth + 1) * 0.5;
  const d1 = dir(az + R(-0.15, 0.15), elMid);
  const mid = [p[0] + d0[0] * len * 0.5, p[1] + d0[1] * len * 0.5, p[2] + d0[2] * len * 0.5];
  const end = [mid[0] + d1[0] * len * 0.5, mid[1] + d1[1] * len * 0.5, mid[2] + d1[2] * len * 0.5];
  kit.rod('bark', p, mid, r, P.bark, { rt: 0.86, seg: depth < 1 ? 8 : 5 });
  kit.rod('bark', mid, end, r * 0.86, P.bark, { rt: 0.8, seg: depth < 1 ? 8 : 5 });
  if (depth >= P.depth) { tips.push({ p: end, az, el: elMid, depth }); return; }
  if (depth >= P.depth - 1) tips.push({ p: mid, az, el: elMid, depth: depth + 0.5, small: true });
  const n = depth === 0 ? RI(2, 3) : RI(2, 3);
  for (let i = 0; i < n; i++) {
    const a = az + (i - (n - 1) / 2) * P.spread + R(-0.25, 0.25);
    const e = elMid * P.flatten + R(-0.12, 0.22) - P.droop * depth * 0.6;
    growBranches(kit, end, a, e, len * P.lenK * R(0.85, 1.1), r * 0.62, depth + 1, P, tips);
  }
}

/* 樱花树 */
function sakuraTree(x, z, s = 1, o = {}) {

  const lean = R(-0.12, 0.12), leanA = R(0, TAU);
  const top = [Math.cos(leanA) * lean * trunkH, trunkH, Math.sin(leanA) * lean * trunkH];
  kit.rod('bark', [0, -0.3, 0], [top[0] * 0.5, trunkH * 0.5, top[2] * 0.5], r0 * 1.15, P.bark, { rt: 0.92, seg: 10 });
  kit.rod('bark', [top[0] * 0.5, trunkH * 0.5, top[2] * 0.5], top, r0 * 1.05, P.bark, { rt: 0.9, seg: 10 });

    const az = a0 + i * TAU / nMain + R(-0.3, 0.3);

  }

  const cc = [cxs / tips.length, cys / tips.length, czs / tips.length];
  let crown = 0; tips.forEach(t => crown = Math.max(crown, Math.hypot(t.p[0] - cc[0], t.p[2] - cc[2])));
  const total = Math.round((o.cards || 1500) * s * s);

  const tint = R(-0.03, 0.03);

  }

/* 绿树（樟树、榉树） */
function greenTree(x, z, s = 1, o = {}) {
  const y = o.y != null ? o.y : groundAt(x, z);
  const kit = new Kit(x, y, z, 0);
  const P = { droop: 0.02, spread: 0.7, flatten: 0.85, lenK: 0.66, depth: 2, bark: new THREE.Color(0x6e6150) };
  const trunkH = 2.2 * s, r0 = 0.22 * s;

  for (let i = 0; i < n; i++) growBranches(kit, [0, trunkH, 0], a0 + i * TAU / n, R(0.8, 1.1), 2.2 * s, r0 * 0.6, 0, P, tips);

/* 黑松 */
function pineTree(x, z, s = 1, o = {}) {
  const y = o.y != null ? o.y : groundAt(x, z);
  const kit = new Kit(x, y, z, 0); const bark = new THREE.Color(0x5e4b3c);
  let p = [0, -0.3, 0]; let a = R(0, TAU); const pts = [p];
  for (let i = 0; i < 4; i++) { const np = [p[0] + Math.cos(a) * 0.6 * s, p[1] + 1.4 * s, p[2] + Math.sin(a) * 0.6 * s]; kit.rod('bark', p, np, 0.2 * s * (1 - i * 0.18), bark, { rt: 0.85, seg: 7 }); p = np; pts.push(np); a += R(-1.2, 1.2); }
  const b = cardBucket('leaf', x, z); const col = new THREE.Color();
  for (let i = 1; i < pts.length; i++) {
    const nb = i === pts.length - 1 ? 1 : 2;
    for (let k = 0; k < nb; k++) {
      const ba = R(0, TAU), bl = R(1.2, 2.4) * s * (1 - i * 0.12);
      const e = [pts[i][0] + Math.cos(ba) * bl, pts[i][1] + R(-0.2, 0.3), pts[i][2] + Math.sin(ba) * bl];
      kit.rod('bark', pts[i], e, 0.07 * s, bark, { rt: 0.5, seg: 5 });

      for (let j = 0; j < 55 * s; j++) {
        const th = R(0, TAU), rr = Math.sqrt(R()) * rc; const px = e[0] + Math.cos(th) * rr, pz = e[2] + Math.sin(th) * rr, py = e[1] + R(-0.15, 0.35) * s;

/* 灌木 */
function shrub(x, z, s = 1, flowers = 0, y) {

  const n = Math.round(30 * s * s);

    const th = R(0, TAU), u = R(0, 1), rr = Math.sqrt(R()) * s;
    const px = Math.cos(th) * rr, pz = Math.sin(th) * rr, py = 0.35 * s + u * 0.55 * s;
    const bright = 0.3 + u * 0.6; col.setRGB(lerp(0.26, 0.55, bright), lerp(0.42, 0.72, bright), lerp(0.26, 0.4, bright));

    addCard(b, x + px, y + py, z + pz, px, 1, pz, R(0.5, 0.75) * s, flowers ? 3 : 1, col, 0.2, px, 1, pz);

}

/* 草丛卡片 */

  k.tail.forEach((g, i) => { if (i) g.rotation.x = 0.25 + Math.sin(t * 2 + i) * 0.12; g.rotation.z = Math.sin(t * 1.5 - i * 0.6) * 0.25; });
  k.head.rotation.y = Math.sin(t * 0.5) * 0.3;
}

}

  for (let i = 0; i < (P.loop ? n : n - 1); i++) { const a = P.pts[i], b = P.pts[(i + 1) % n]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d <= l) { const t = d / l; let dx = b[0] - a[0], dz = b[1] - a[1]; if (back) { dx = -dx; dz = -dz; } return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, Math.atan2(dx, dz)]; } d -= l; }

}

    } else if (n.home && !n.override) { n.pos.set(n.home[0], n.pos.y || groundAt(n.home[0], n.home[1]), n.home[1]); }

function findInteract() {

function dealLetters() {

const _fw = new THREE.Vector3();
function updatePlayer(dt, t) {
  const P = PLAYER;
  // 视角
  P.camYaw -= INPUT.lookX; P.camPitch = clamp(P.camPitch + INPUT.lookY * (store.get('invertY', false) ? -1 : 1), -1.2, 1.25); INPUT.lookX = INPUT.lookY = 0;
  // 移动输入
  let mx = 0, mz = 0;
  if (KEYS.has('w') || KEYS.has('arrowup')) mz += 1; if (KEYS.has('s') || KEYS.has('arrowdown')) mz -= 1;
  if (KEYS.has('a') || KEYS.has('arrowleft')) mx += 1; if (KEYS.has('d') || KEYS.has('arrowright')) mx -= 1;
  if (TOUCH.move) { const dx = TOUCH.move.x - TOUCH.move.x0, dy = TOUCH.move.y - TOUCH.move.y0; const L = Math.hypot(dx, dy); if (L > 8) { mx -= dx / Math.max(L, 60); mz -= dy / Math.max(L, 60); } INPUT.touchRun = L > 70; }
  const run = KEYS.has('shift') || INPUT.touchRun || INPUT.forceRun;
  const moving = Math.hypot(mx, mz) > 0.1;
  if (GAME.fishing && (moving || INPUT.jump)) { GAME.fishing = null; rod.visible = fishLine.visible = bobber.visible = false; UI.bite(false); }
  if (GAME.sitting) {
    if (moving || INPUT.jump) { INPUT.jump = false; GAME.standUp(); }
    else {
      const s = GAME.sitting;
      if (s.attach) { const wp = new THREE.Vector3(); s.attach.updateMatrixWorld(); playerHolder.getWorldPosition(wp); P.pos.copy(wp); playerHolder.rotation.y = s.ry; }
      else { playerHolder.position.copy(P.pos); playerHolder.rotation.y = P.yaw; }
      playerChar.root.position.y = 0; poseCharacter(playerChar, dt, 'sit', 0, t); return;
    }
  }
  if (GAME.fishing) { playerHolder.position.copy(P.pos); playerHolder.rotation.y = P.yaw; playerChar.root.position.y = 0; poseCharacter(playerChar, dt, 'fish', 0, t); INPUT.jump = false; return; }
  const fx = Math.sin(P.camYaw), fz = Math.cos(P.camYaw);
  let vx = (fx * mz + fz * mx), vz = (fz * mz - fx * mx); const vl = Math.hypot(vx, vz); if (vl > 1) { vx /= vl; vz /= vl; }
  if (P.fly) {
    const sp = run ? 26 : 11; const cp = Math.cos(P.camPitch);
    P.pos.x += (fx * mz * cp + fz * mx) * sp * dt; P.pos.z += (fz * mz * cp - fx * mx) * sp * dt; P.pos.y += (-Math.sin(P.camPitch) * mz) * sp * dt;
    if (KEYS.has(' ')) P.pos.y += sp * 0.6 * dt; if (KEYS.has('c') || KEYS.has('control')) P.pos.y -= sp * 0.6 * dt;
    const r = Math.hypot(P.pos.x, P.pos.z); if (r > 330) { P.pos.x *= 330 / r; P.pos.z *= 330 / r; }
    P.pos.y = clamp(P.pos.y, terrainH(P.pos.x, P.pos.z) + 0.5, 180); INPUT.jump = false;
    if (moving) P.yaw = Math.atan2(vx, vz);
    P.speed = 0;
  } else {
    const sp = run ? 7.2 : 4.0; const ox = P.pos.x, oz = P.pos.z;
    const nx = P.pos.x + vx * sp * dt, nz = P.pos.z + vz * sp * dt;
    const ok = (x, z) => { const g = groundAt(x, z, P.pos.y); return (terrainH(x, z) > -0.35 || groundAt.floor) && islandC(x, z) > -0.2 && g < P.pos.y + 0.55; };
    if (ok(nx, nz)) { P.pos.x = nx; P.pos.z = nz; } else if (ok(nx, oz)) P.pos.x = nx; else if (ok(ox, nz)) P.pos.z = nz;
    pushOut(P.pos, 0.3, P.pos.y);
    if (!ok(P.pos.x, P.pos.z) && terrainH(P.pos.x, P.pos.z) < -0.35 && !groundAt.floor) { P.pos.x = ox; P.pos.z = oz; }
    // 列车 / 汽车
    if (TRAIN.box) { const b = TRAIN.box; if (P.pos.x > b.x0 && P.pos.x < b.x1 && P.pos.z > b.z0 && P.pos.z < b.z1 && P.pos.y < RAIL_Y + 3.8) { const zc = (b.z0 + b.z1) / 2; P.pos.z = P.pos.z < zc ? b.z0 - 0.05 : b.z1 + 0.05; if (TRAIN.v > 1) UI.toast('危险！请离铁轨远一点。'); } }
    for (const c of CARS) { if (!c.box) continue; const dx = P.pos.x - c.box.x, dz = P.pos.z - c.box.z; const lx = dx * c.box.c - dz * c.box.s, lz = dx * c.box.s + dz * c.box.c; if (Math.abs(lx) < c.box.hw + 0.3 && Math.abs(lz) < c.box.hl + 0.3 && P.pos.y < c.g.position.y + 2) { const px = c.box.hw + 0.3 - Math.abs(lx), pz = c.box.hl + 0.3 - Math.abs(lz); if (px < pz) { const s = Math.sign(lx) || 1; P.pos.x += c.box.c * s * px; P.pos.z += -c.box.s * s * px; } else { const s = Math.sign(lz) || 1; P.pos.x += c.box.s * s * pz; P.pos.z += c.box.c * s * pz; } } }
    // 垂直
    const g = groundAt(P.pos.x, P.pos.z, P.pos.y);
    if (P.onGround) { if (g < P.pos.y - 0.6) P.onGround = false; else { P.pos.y = g; P.vy = 0; } }
    if (INPUT.jump && P.onGround) { P.vy = 6.6; P.onGround = false; }
    INPUT.jump = false;
    if (!P.onGround) { P.vy -= 20 * dt; P.pos.y += P.vy * dt; const g2 = groundAt(P.pos.x, P.pos.z, P.pos.y - P.vy * dt); if (P.pos.y <= g2) { P.pos.y = g2; P.vy = 0; P.onGround = true; } }
    if (moving) { const want = Math.atan2(vx, vz); let dy = want - P.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); P.yaw += dy * Math.min(1, dt * 12); }
    P.speed = moving ? sp : 0;
    if (moving && P.onGround) { P.stepT -= dt * sp; if (P.stepT < 0) { P.stepT = 1.4; AUDIO.step(run ? 1.2 : 0.8); } }
  }
  playerHolder.position.copy(P.pos); playerHolder.rotation.y = P.yaw; playerChar.root.position.y = 0;
  poseCharacter(playerChar, dt, P.fly ? 'idle' : !P.onGround ? 'run' : moving ? (run ? 'run' : 'walk') : 'idle', P.speed, t);
  if (!P.onGround && !P.fly) { for (const l of playerChar.legs) { l.hip.rotation.x = -0.6 * (l.s > 0 ? 1 : 0.2); l.kn.rotation.x = 0.9; } }
}
const _camT = new THREE.Vector3(), _camP = new THREE.Vector3();
function updateCamera(dt) {
  const P = PLAYER; const first = GAME.cam === 'first';
  const inside = insideHome(P.pos.x, P.pos.z);
  playerHolder.visible = !first || GAME.sitting;
  const eyeH = GAME.sitting ? 1.15 : 1.42;
  _camT.set(P.pos.x, P.pos.y + (first ? eyeH : 1.3), P.pos.z);
  const cy = Math.cos(P.camPitch);
  const dir = new THREE.Vector3(Math.sin(P.camYaw) * cy, -Math.sin(P.camPitch), Math.cos(P.camYaw) * cy);
  if (first && !GAME.sitting) { camera.position.copy(_camT); camera.lookAt(_camT.clone().add(dir)); return; }
  let dist = inside ? Math.min(P.camDist, 2.4) : P.camDist; if (GAME.sitting) dist = Math.max(dist, 3.2);
  // 相机避让
  let d = 0.4; const step = 0.25;
  while (d < dist) { const x = _camT.x - dir.x * d, y = _camT.y - dir.y * d + 0.15, z = _camT.z - dir.z * d; if (blockedAt(x, y, z)) break; d += step; }
  d = Math.max(0.6, d - 0.2);
  _camP.set(_camT.x - dir.x * d, _camT.y - dir.y * d + 0.15, _camT.z - dir.z * d);
  const tg = terrainH(_camP.x, _camP.z) + 0.4; if (_camP.y < tg) _camP.y = tg;
  camera.position.lerp(_camP, Math.min(1, dt * 14));
  camera.lookAt(_camT);
}

let mapBase = null; const MAP_S = 600, MAP_PX = 600; // 世界 600m → 600px
function buildMapBase() {
  const c = makeCanvas(MAP_PX, MAP_PX); const g = c.getContext('2d'); const img = g.createImageData(MAP_PX, MAP_PX); const d = img.data;
  for (let j = 0; j < MAP_PX; j++) for (let i = 0; i < MAP_PX; i++) {
    const x = -MAP_S / 2 + (i + 0.5) * MAP_S / MAP_PX, z = -MAP_S / 2 + (j + 0.5) * MAP_S / MAP_PX; const h = terrainH(x, z); const k = (j * MAP_PX + i) * 4;
    let r, gg, b;
    if (h < 0.02) { const dp = clamp(-h / 6, 0, 1); r = lerp(150, 70, dp); gg = lerp(214, 140, dp); b = lerp(214, 196, dp); }
    else if (h < 1.2 && (islandC(x, z) < 0.16 || z > 86)) { r = 240; gg = 226; b = 186; }
    else { const s = clamp((h - 2) / 20, 0, 1); r = lerp(176, 140, s); gg = lerp(206, 176, s); b = lerp(140, 120, s); }
    d[k] = r; d[k + 1] = gg; d[k + 2] = b; d[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const W = (x) => (x + MAP_S / 2) * MAP_PX / MAP_S;
  // 河流
  g.strokeStyle = '#7fc0d6'; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); RIVER.forEach((p, i) => i ? g.lineTo(W(p[0]), W(p[1])) : g.moveTo(W(p[0]), W(p[1]))); g.stroke();
  // 道路
  g.fillStyle = '#f7f1e6';
  const rects = [[-7, 7, -84, 44], [-46, 104, -84, -76], [96, 108, -84, 47], [-62, 104, 34, 47], [22, 26, -50, 36], [-26, -22, -17, 36], [-62, 22, -23, -17], [-98, -94, -45, 65]];
  for (const [x0, x1, z0, z1] of rects) g.fillRect(W(x0), W(z0), W(x1) - W(x0), W(z1) - W(z0));
  // 铁路
  g.strokeStyle = '#8a8f99'; g.lineWidth = 3; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(W(-170), W(-60)); g.lineTo(W(140), W(-60)); g.stroke(); g.setLineDash([]);
  // 建筑
  g.fillStyle = 'rgba(120,110,120,0.55)';
  for (const c2 of COLS) { if (c2.ramp || c2.walk || c2.round || c2.noFloor) continue; if (c2.y1 - c2.y0 < 2.4) continue; g.save(); g.translate(W(c2.x), W(c2.z)); g.rotate(-Math.atan2(c2.s, c2.c)); g.fillRect(-c2.hw * MAP_PX / MAP_S, -c2.hd * MAP_PX / MAP_S, c2.hw * 2 * MAP_PX / MAP_S, c2.hd * 2 * MAP_PX / MAP_S); g.restore(); }
  // 樱花
  for (const t of TREES) { g.fillStyle = t.kind === 'sakura' ? 'rgba(240,160,190,0.85)' : 'rgba(90,140,80,0.6)'; g.beginPath(); g.arc(W(t.x), W(t.z), Math.max(1.5, t.r * 0.6), 0, TAU); g.fill(); }
  // 广场
  g.strokeStyle = '#e48fa6'; g.lineWidth = 2; g.beginPath(); g.arc(W(PLAZA.x), W(PLAZA.z), 19, 0, TAU); g.stroke();
  mapBase = c;
}
function drawMapTo(ctx, size, cx, cz, scale, rotate, labels) {
  const k = size / (MAP_S * scale);

  ctx.translate(size / 2, size / 2); if (rotate != null) ctx.rotate(rotate);
  ctx.scale(k * MAP_S / MAP_PX, k * MAP_S / MAP_PX);

  ctx.restore();
  const toS = (x, z) => { let dx = (x - cx) * k, dz = (z - cz) * k; if (rotate != null) { const c = Math.cos(rotate), s = Math.sin(rotate); [dx, dz] = [dx * c - dz * s, dx * s + dz * c]; } return [size / 2 + dx, size / 2 + dz]; };
  // 收件人

    let x, z; if (l.mailbox) { const m = MAILBOXES.find(mm => mm.name === l.mailbox); if (!m) continue; x = m.x; z = m.z; } else { const n = NPC_BY(l.to); if (!n) continue; x = n.pos.x; z = n.pos.z; }
    let [sx, sy] = toS(x, z); const r = size / 2 - 10; const dx = sx - size / 2, dy = sy - size / 2; const L = Math.hypot(dx, dy); if (!labels && L > r) { sx = size / 2 + dx / L * r; sy = size / 2 + dy / L * r; }

  }
  if (S().gotDay !== S().day) { const f = NPC_BY('fang'); if (f) { const [sx, sy] = toS(f.pos.x, f.pos.z); ctx.fillStyle = '#c8352e'; ctx.beginPath(); ctx.arc(sx, sy, 7, 0, TAU); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); } }
  if (labels) {
    ctx.font = `400 ${Math.round(size / 34)}px ${FONT.wei}`; ctx.textAlign = 'center';
    const big = Math.round(size / 34), small = Math.round(size / 46);
    PLACES.forEach((p, i) => { const [sx, sy] = toS(p.x, p.z); const main = i < 9; ctx.font = `400 ${main ? big : small}px ${FONT.wei}`; ctx.fillStyle = 'rgba(34,48,74,0.85)'; ctx.beginPath(); ctx.arc(sx, sy, main ? 4 : 3, 0, TAU); ctx.fill(); const txt = (main ? (i + 1) + ' ' : '') + p.name; const oy = main ? -9 : small + 6; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(251,247,239,0.95)'; ctx.strokeText(txt, sx, sy + oy); ctx.fillStyle = main ? '#22304a' : '#5b6478'; ctx.fillText(txt, sx, sy + oy); });
  }
  // 玩家
  const [px, py] = toS(PLAYER.pos.x, PLAYER.pos.z); ctx.save(); ctx.translate(px, py); ctx.rotate((rotate || 0) - PLAYER.yaw + Math.PI);
  ctx.fillStyle = '#22304a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(7, 7); ctx.lineTo(0, 3); ctx.lineTo(-7, 7); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
}

const tick = () => new Promise(r => setTimeout(r, 0));
function progress(p, text) { $('loadBar').style.width = Math.round(p * 100) + '%'; $('loadText').textContent = text; }

}
function scatterNature() {
  seed(77);
  // 山丘上的绿树
  let n = 0;
  for (let i = 0; i < 900 && n < 150; i++) {
    const x = R(-210, 200), z = R(-175, 170); const c = islandC(x, z); if (c < 0.06) continue;
    const h = terrainH(x, z); if (h < 2.6) continue;
    if (x > -116 && x < 112 && z > -88 && z < 76) continue;
    if (Math.abs(z + 60) < 14 && x > -170 && x < 140) continue;

    if (chance(0.25)) pineTree(x, z, R(0.9, 1.3)); else greenTree(x, z, R(0.8, 1.4), { cards: 520 });
    n++;
  }
  // 海岸黑松
  for (let i = 0; i < 400 && n < 200; i++) { const a = R(0, TAU); const x = Math.cos(a) * 200 * R(0.8, 0.98), z = Math.sin(a) * 165 * R(0.8, 0.98); const c = islandC(x, z); if (c < 0.03 || c > 0.12) continue; const h = terrainH(x, z); if (h < 0.8) continue; if (z > 80 && Math.abs(x) < 110) continue; if (x > 120 && z > -32 && z < 62) continue; pineTree(x, z, R(0.8, 1.2)); n++; }
  // 草丛与野花
  for (let i = 0; i < 2600; i++) {
    const x = R(-215, 205), z = R(-175, 170); const h = terrainH(x, z); if (h < 1.4) continue;
    const town = (x > -114 && x < 110 && z > -86 && z < 74) || (x > 96 && x < 132 && z > -36 && z < 66) || (z > 84 && Math.abs(x - 10) < 120); if (town && !(riverDist(x, z) > 8.6 && riverDist(x, z) < 15)) continue;
    if (Math.abs(z + 60) < 9 && x > -170 && x < 140) continue;
    if (polyDist(CAPE_PATH, x, z) < 2.2 || (Math.abs(x + 40) < 24 && z < -84 && z > -152 && h > 13)) continue;
    grassPatch(x, z, null, RI(4, 8), 1.4);
  }
  // 镇内的灌木

  // 零散樱花（站前、北路、港口路）
  for (const [x, z, s] of [[36, -42, 0.9], [72, -41, 0.95], [88, -44, 1.0], [-20, -80, 1.0], [-58, -80, 1.05], [20, -88, 1.0], [110, 40, 0.9], [110, -40, 0.95], [-110, -46, 1.0], [-118, 46, 1.0], [-90, 84, 1.0], [-44, 46, 0.9], [44, 50, 0.9]]) sakuraTree(x, z, s, { cards: 1400 });
}

  buildTerrain(); buildDepthTex(); buildSea(); buildRiver(); buildSky(); buildFarLand();

  progress(0.3, '正在盖房子……'); await tick();

/* ---------------- 主循环 ---------------- */
let last = performance.now(), T = 0, hudT = 0, mmT = 0, saveT = 0, envT = 0; const ENV = { sea: 0, trees: 0, night: 0, crossing: 0, train: 0, trainSpeed: 0, windy: 0.3, height: 0, musicOn: true };
let petalNear = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (!PLAYER.pos || !playerHolder) { renderer.render(scene, camera); return; }
  const st = S();
  if (GAME.started && !UI.modalOpen()) {
    st.min += dt * GAME.timeFlow * (GAME.sitting ? 6 : 1);
    if (st.min >= 24 * 60) { st.min = 24 * 60 - 1; if (!GAME._passing) { GAME._passing = true; UI.toast('太晚了……你迷迷糊糊地回到了家。'); GAME.sleep(false); setTimeout(() => GAME._passing = false, 3000); } }
  }
  const hour = st.min / 60;
  applyTimeOfDay(hour);
  if (GAME.started) {
    if (!UI.modalOpen() && !UI.dialogOpen()) updatePlayer(dt, T); else if (UI.dialogOpen()) { playerHolder.position.copy(PLAYER.pos); poseCharacter(playerChar, dt, GAME.sitting ? 'sit' : 'idle', 0, T); }
    updateCamera(dt);
  } else {
    const a = T * 0.05; camera.position.set(PLAZA.x + Math.cos(a) * 46, TOWN_Y + 20, PLAZA.z - 20 + Math.sin(a) * 46); camera.lookAt(PLAZA.x, TOWN_Y + 4, PLAZA.z - 20);
    playerHolder.position.copy(PLAYER.pos); poseCharacter(playerChar, dt, 'idle', 0, T);
  }
  updateNPCs(dt, T, hour, PLAYER.pos); updateTrain(dt); updateCrossings(dt, T); updateCars(dt, PLAYER.pos);
  updateAnimals(dt, T, hour); updateDate(dt, T, hour); updateFishing(dt, T); updateSparks(dt);
  for (const f of UPDATERS) f(dt, T);
  // 着色器时间
  SEA_U.time.value = T; WIND.uTime.value = T; WIND.uWind.value = 0.8 + Math.sin(T * 0.23) * 0.35 + Math.sin(T * 0.071) * 0.25;
  PETAL_U.camPos.value.copy(camera.position);
  // 太阳阴影跟随
  const tp = PLAYER.pos; sun.target.position.set(Math.round(tp.x), Math.round(tp.y), Math.round(tp.z)); sun.position.copy(sun.target.position).addScaledVector(LIGHT_DIR, 150); sun.target.updateMatrixWorld();
  const sky = scene.getObjectByName('sky'); if (sky) sky.position.copy(camera.position);
  // 动态物件

  if (LIGHTHOUSE.beam) LIGHTHOUSE.beam.rotation.y = T * 0.6;
  if (SCHOOL_CLOCK.h) { SCHOOL_CLOCK.h.rotation.z = -(hour % 12) / 12 * TAU; SCHOOL_CLOCK.m.rotation.z = -(st.min % 60) / 60 * TAU; }
  if (homeDoor) { const d = Math.hypot(PLAYER.pos.x - HOME.door[0], PLAYER.pos.z - HOME.door[2]); const want = d < 2.6 ? 1 : 0; homeDoor.open += clamp(want - homeDoor.open, -dt * 2.5, dt * 2.5); homeDoor.g.rotation.y = HOME.ry - homeDoor.open * 1.6; }
  const inside = insideHome(PLAYER.pos.x, PLAYER.pos.z);
  if (homeLight) homeLight.intensity = (inside ? 0.7 : 0.25) + NIGHT.v * 0.9;
  const foxOn = st.flags.fox && NIGHT.v > 0.4; lanternLight.intensity = foxOn ? 1.2 : 0; lanternSprite.material.opacity = foxOn ? 0.7 + Math.sin(T * 3) * 0.15 : 0;
  // 交互提示
  hudT -= dt; mmT -= dt; envT -= dt; saveT += dt;
  if (GAME.started) {
    currentInteract = UI.anyOpen() ? null : findInteract();
    const pr = $('prompt');
    if (GAME.sitting) { pr.hidden = false; $('promptText').textContent = '起身'; pr.firstChild.textContent = IS_TOUCH ? '点' : '空格'; }
    else if (GAME.fishing) { pr.hidden = false; $('promptText').textContent = GAME.fishing.bite > 0 ? '快收竿！' : '收竿'; pr.firstChild.textContent = IS_TOUCH ? '点' : 'E'; }
    else if (currentInteract) { pr.hidden = false; $('promptText').textContent = currentInteract.label; pr.firstChild.textContent = IS_TOUCH ? '点' : 'E'; }
    else pr.hidden = true;
    if (hudT < 0) { hudT = 0.5; $('hudTime').textContent = fmtTime(st.min); $('hudPhase').textContent = phaseName(hour); }

    // 夜樱邮票

}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
